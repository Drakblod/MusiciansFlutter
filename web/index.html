<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="musicians_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>musicians_flutter</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Google Maps Custom Dark Themed InfoWindow */
    .gm-style-iw,
    .gm-style-iw * {
      color: #ffffff !important;
    }
    .gm-style .gm-style-iw-c {
      background: linear-gradient(145deg, #221c40, #130f26) !important;
      border: 1.5px solid #8b5cf6 !important;
      border-radius: 14px !important;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85), 0 0 16px rgba(139, 92, 246, 0.35) !important;
      padding: 14px 16px !important;
      max-width: 320px !important;
    }
    .gm-style .gm-style-iw-tc::after {
      background-color: #130f26 !important;
    }
    .gm-style .gm-style-iw-t::after {
      background: #130f26 !important;
      box-shadow: -1px 1px 2px rgba(0, 0, 0, 0.5) !important;
    }
    .gm-style .gm-style-iw-d {
      overflow: hidden !important;
      padding: 0 !important;
      color: #ffffff !important;
    }
    .gm-style-iw-d,
    .gm-style-iw-d * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      color: #ffffff !important;
    }
    .gm-style .gm-style-iw-d > *:first-child,
    .gm-style .gm-style-iw-d div:first-child,
    .gm-style .gm-style-iw-d p:first-child,
    .gm-style .gm-style-iw-d .gm-title {
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      letter-spacing: 0.2px !important;
      line-height: 1.35 !important;
    }
    .gm-style .gm-style-iw-d > *:last-child,
    .gm-style .gm-style-iw-d div:last-child,
    .gm-style .gm-style-iw-d p:last-child {
      color: #c4b5fd !important;
      font-size: 12px !important;
      margin-top: 5px !important;
      line-height: 1.3 !important;
      font-weight: 500 !important;
    }
    .gm-style .gm-ui-hover-effect {
      filter: invert(1) brightness(1.5) !important;
      opacity: 0.85 !important;
      top: 6px !important;
      right: 6px !important;
    }
    .gm-style .gm-ui-hover-effect:hover {
      opacity: 1 !important;
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
